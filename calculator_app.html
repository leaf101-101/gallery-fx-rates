<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fine Art Portfolio — Currency Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #1d4a47;
    --teal-light: #e8f0ef;
    --amber: #c8922a;
    --amber-light: #faf4e8;
    --terra: #c0472a;
    --ink: #1a2422;
    --ink-mid: #4a5550;
    --ink-light: #8a9590;
    --rule: #dde5e3;
    --rule-light: #eef2f1;
    --bg: #f7f9f8;
    --surface: #ffffff;
    --radius: 6px;
  }
  body {
    font-family: 'Jost', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
    flex-shrink: 0;
  }
  .site-header img {
    height: 48px;
    width: auto;
  }
  .header-right {
    text-align: right;
  }
  .header-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-light);
    font-weight: 500;
  }
  .header-date {
    font-size: 13px;
    color: var(--ink-mid);
    font-weight: 300;
    margin-top: 2px;
  }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 24px 64px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 10px;
    width: 100%;
    max-width: 520px;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(29,74,71,0.06);
  }

  /* Card header strip */
  .card-header {
    background: var(--teal);
    padding: 22px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    color: #ffffff;
    letter-spacing: 1px;
  }
  .card-subtitle {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-top: 3px;
    font-weight: 400;
  }
  .updated-badge {
    text-align: right;
  }
  .updated-label {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
  }
  .updated-time {
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    font-weight: 300;
    margin-top: 2px;
  }

  /* Card body */
  .card-body { padding: 28px 32px; }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
    padding: 10px 14px;
    background: var(--teal-light);
    border-radius: var(--radius);
    border: 1px solid #c0d4d2;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    flex-shrink: 0;
  }
  .status-dot.error { background: var(--terra); }
  .status-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--teal);
    font-weight: 500;
  }
  .status-bar.error-state { background: #fdf0ed; border-color: #e8c4bb; }
  .status-bar.error-state .status-label { color: var(--terra); }

  /* Form */
  .field-group { margin-bottom: 20px; }
  label {
    display: block;
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--ink-light);
    font-weight: 500;
    margin-bottom: 8px;
  }

  /* Currency tabs */
  .currency-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .currency-tab {
    padding: 7px 16px;
    border: 1px solid var(--rule);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    color: var(--ink-mid);
    background: var(--bg);
    cursor: pointer;
    transition: all 0.15s;
  }
  .currency-tab.active {
    background: var(--teal);
    color: #ffffff;
    border-color: var(--teal);
  }
  .currency-tab:hover:not(.active) {
    border-color: var(--teal);
    color: var(--teal);
  }

  /* ZAR input */
  .input-wrap { position: relative; }
  .currency-symbol {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-mid);
    pointer-events: none;
  }
  input[type="number"] {
    width: 100%;
    height: 52px;
    padding: 0 14px 0 34px;
    font-family: 'Jost', sans-serif;
    font-size: 20px;
    font-weight: 300;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type="number"]:focus { border-color: var(--teal); }

  /* Convert button */
  .calc-btn {
    width: 100%;
    height: 50px;
    background: var(--teal);
    color: #ffffff;
    border: none;
    border-radius: var(--radius);
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 4px;
  }
  .calc-btn:hover { background: #163735; }
  .calc-btn:active { background: #0f2826; }

  /* Divider */
  .divider { height: 1px; background: var(--rule-light); margin: 24px 0; }

  /* Result */
  .result-section { display: none; }
  .result-section.visible { display: block; }

  .result-box {
    background: var(--amber-light);
    border: 1px solid #e8d4aa;
    border-radius: var(--radius);
    padding: 20px 24px;
  }
  .result-eyebrow {
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .result-amount {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .result-code {
    font-size: 18px;
    color: var(--ink-mid);
    font-weight: 300;
    margin-left: 6px;
    letter-spacing: 1px;
    font-family: 'Jost', sans-serif;
  }
  .result-sub {
    font-size: 12px;
    color: var(--ink-light);
    margin-top: 8px;
    font-weight: 300;
  }

  /* Footer */
  .card-footer {
    padding: 14px 32px;
    border-top: 1px solid var(--rule-light);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-note {
    font-size: 11px;
    color: var(--ink-light);
    font-weight: 300;
  }
  .footer-since {
    font-size: 11px;
    color: var(--ink-light);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
  }

  @media (max-width: 480px) {
    .site-header { padding: 0 20px; height: 64px; }
    .site-header img { height: 38px; }
    .card-body { padding: 20px 20px; }
    .card-header { padding: 18px 20px; }
    .card-footer { padding: 12px 20px; flex-direction: column; gap: 4px; text-align: center; }
    .result-amount { font-size: 38px; }
    .main { padding: 24px 12px 48px; }
  }
</style>
</head>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAAAAOkAAAAA6QAAAADpAAH/9k=" alt="Fine Art Portfolio" />
  <div class="header-right">
    <div class="header-label">Currency Calculator</div>
    <div class="header-date" id="header-date"></div>
  </div>
</header>

<main class="main">
  <div class="card">

    <div class="card-header">
      <div>
        <div class="card-title">Daily Exchange Rates</div>
        <div class="card-subtitle">For gallery use only</div>
      </div>
      <div class="updated-badge">
        <div class="updated-label">Last updated</div>
        <div class="updated-time" id="updated-time">—</div>
      </div>
    </div>

    <div class="card-body">

      <div class="status-bar" id="status-bar">
        <div class="status-dot" id="status-dot"></div>
        <div class="status-label" id="status-label">Loading rates…</div>
      </div>

      <div class="field-group">
        <label>Select currency</label>
        <div class="currency-tabs" id="currency-tabs"></div>
      </div>

      <div class="field-group">
        <label>ZAR amount</label>
        <div class="input-wrap">
          <span class="currency-symbol">R</span>
          <input type="number" id="zar-input" placeholder="0" min="0" step="1" />
        </div>
      </div>

      <button class="calc-btn" onclick="calculate()">Convert</button>

      <div class="divider"></div>

      <div class="result-section" id="result-section">
        <div class="result-box">
          <div class="result-eyebrow">Foreign currency amount</div>
          <div class="result-amount">
            <span id="result-value">0.00</span><span class="result-code" id="result-code">USD</span>
          </div>
          <div class="result-sub" id="result-sub"></div>
        </div>
      </div>

    </div>

    <div class="card-footer">
      <span class="footer-note">Rates valid today only &bull; Not for client display</span>
      <span class="footer-since">Since 1987</span>
    </div>

  </div>
</main>

<script>
const CURRENCIES = ['USD','EUR','GBP','AUD','CHF'];
const PAIRS = { USD:'USD/ZAR', EUR:'EUR/ZAR', GBP:'GBP/ZAR', AUD:'AUD/ZAR', CHF:'CHF/ZAR' };
let rates = {};
let selectedCurrency = 'USD';

const today = new Date();
document.getElementById('header-date').textContent = today.toLocaleDateString('en-ZA', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

function buildTabs() {
  const wrap = document.getElementById('currency-tabs');
  wrap.innerHTML = '';
  CURRENCIES.forEach(code => {
    const b = document.createElement('button');
    b.className = 'currency-tab' + (code === selectedCurrency ? ' active' : '');
    b.textContent = code;
    b.onclick = () => { selectedCurrency = code; buildTabs(); const v = parseFloat(document.getElementById('zar-input').value); if (v > 0) calculate(); };
    wrap.appendChild(b);
  });
}

function setStatus(msg, isError) {
  const bar = document.getElementById('status-bar');
  const dot = document.getElementById('status-dot');
  document.getElementById('status-label').textContent = msg;
  if (isError) { bar.classList.add('error-state'); dot.classList.add('error'); }
  else { bar.classList.remove('error-state'); dot.classList.remove('error'); }
}

function calculate() {
  const zarAmount = parseFloat(document.getElementById('zar-input').value);
  if (!zarAmount || zarAmount <= 0 || !rates[selectedCurrency]) {
    document.getElementById('result-section').classList.remove('visible');
    return;
  }
  const rate = rates[selectedCurrency];
  const fxAmount = zarAmount / rate;
  document.getElementById('result-value').textContent = fxAmount.toLocaleString('en-ZA', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  document.getElementById('result-code').textContent = ' ' + selectedCurrency;
  document.getElementById('result-sub').textContent = 'R\u00a0' + zarAmount.toLocaleString('en-ZA', { minimumFractionDigits: 0 }) + ' at ' + rate.toFixed(0) + ' ' + PAIRS[selectedCurrency];
  document.getElementById('result-section').classList.add('visible');
}

async function loadRates() {
  try {
    const resp = await fetch('https://leaf101-101.github.io/gallery-fx-rates/current_rates.json?v=' + Date.now());
    if (!resp.ok) throw new Error('No rates');
    const data = await resp.json();
    CURRENCIES.forEach(code => { if (data[code]) rates[code] = data[code].gallery_rate; });
    const dateStr = data[Object.keys(data)[0]]?.date || '';
    setStatus('Rates current as at ' + dateStr, false);
    document.getElementById('updated-time').textContent = dateStr + ' · 08:00 & 13:00 SAST';
    return true;
  } catch(e) { return false; }
}

function loadFallback() {
  rates = { USD: 16.2837, EUR: 18.9800, GBP: 21.8735, AUD: 11.5350, CHF: 20.3841 };
  setStatus('Could not load live rates — please refresh', true);
  document.getElementById('updated-time').textContent = 'Unavailable';
}

document.getElementById('zar-input').addEventListener('input', () => {
  if (parseFloat(document.getElementById('zar-input').value) > 0) calculate();
  else document.getElementById('result-section').classList.remove('visible');
});
document.getElementById('zar-input').addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });

buildTabs();
loadRates().then(ok => { if (!ok) loadFallback(); });
</script>
</body>
</html>
